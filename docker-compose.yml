services:
  app:
    build: .
    image: sentiment-imdb:latest
    container_name: sentiment-imdb
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
